	<form class="form-horizontal" action="http://localhost:8080/admin/goods_edit" method="post" enctype="multipart/form-data">

		<input type="hidden" name="cover" value="/picture/14-1.jpg"/>
		<input type="hidden" name="image1" value="/picture/14-1.jpg"/>

		<div class="form-group">
			<label for="input_name" class="col-sm-1 control-label">名称</label>
			<div class="col-sm-6">
				<input type="text" class="form-control" id="input_name" name="name" value="意大利芝士饼干" required="required">
			</div>
		</div>
		<div class="form-group">
			<label for="input_name" class="col-sm-1 control-label">价格</label>
			<div class="col-sm-6">
				<input type="text" class="form-control" id="input_name" name="price" value="39.0">

		</div>
		<div class="form-group">
			<label for="input_name" class="col-sm-1 control-label">介绍</label>

				<input type="text" class="form-control" id="input_name" name="intro" value="采用帕玛森芝士为主要原材料制作的意大利芝士饼,奶香浓郁,鲜香可口.">
			</div>
		</div>
		<div class="form-group">
			<label for="input_name" class="col-sm-1 control-label">库存</label>
			<div class="col-sm-6">

			</div>
		</div>
		<div class="form-group">
			<label for="input_file" class="col-sm-1 control-label">封面图片</label>
			<div class="col-sm-6"><img src="../picture/14-1.jpg" tppabs="http://localhost:8080/picture/14-1.jpg" width="100" height="100"/>
				<input type="file" name="cover"  id="input_file">推荐尺寸: 500 * 500
			</div>
		</div>
		<div class="form-group">
			<label for="input_file" class="col-sm-1 control-label">详情图片1</label>
			<div class="col-sm-6"><img src="../picture/14-1.jpg" tppabs="http://localhost:8080/picture/14-1.jpg" width="100" height="100"/>

		<div class="form-group">

						<option  value="4">法式系列</option>
