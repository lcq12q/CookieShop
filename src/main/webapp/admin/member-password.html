<!DOCTYPE html>
<html class="x-admin-sm">
<head>
	<meta charset="UTF-8">
	<title>欢迎页面-X-admin2.2</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../css/font.css">
	<link rel="stylesheet" href="../css/xadmin.css">
	<!-- 1. 引入本地 jQuery -->
	<script type="text/javascript" src="../js/jquery1.12.4.js"></script>
	<!-- 2. 引入 Layui 核心 JS -->
	<script type="text/javascript" src="../lib/layui/layui.js" charset="utf-8"></script>
	<!-- 3. 引入 xadmin.js -->
	<script type="text/javascript" src="../js/xadmin.js"></script>
</head>
<body>
<div class="layui-fluid">
	<div class="layui-row">
		<form class="layui-form">
			<!-- 隐藏域保存用户ID -->
			<input type="hidden" id="userId" name="id">
			<div class="layui-form-item">
				<label for="L_username" class="layui-form-label">用户名</label>
				<div class="layui-input-inline">
					<input type="text" id="L_username" name="username" disabled="" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label for="L_email" class="layui-form-label">邮箱</label>
				<div class="layui-input-inline">
					<input type="text" id="L_email" name="email" disabled="" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label for="L_pass" class="layui-form-label">
					<span class="x-red">*</span>新密码
				</label>
				<div class="layui-input-inline">
					<input type="password" id="L_pass" name="newpass" required="" lay-verify="required" autocomplete="off" class="layui-input">
				</div>
				<div class="layui-form-mid layui-word-aux">1到32个字符</div>
			</div>
			<div class="layui-form-item">
				<label for="L_pass" class="layui-form-label"></label>
				<button class="layui-btn" lay-filter="save" lay-submit="">更改</button>
			</div>
		</form>
	</div>
</div>
<script>
	// 直接使用全局的 $（因为 jquery1.12.4.js 已经全局加载）
	var $ = window.jQuery || window.$

	layui.use(['form', 'layer'], function() {
		var form = layui.form
		var layer = layui.layer

		// 获取 URL 中的 id 参数
		function getQueryVariable(variable) {
			var query = window.location.search.substring(1)
			var vars = query.split('&')
			for (var i = 0; i < vars.length; i++) {
				var pair = vars[i].split('=')
				if (pair[0] === variable) { return pair[1] }
			}
			return false
		}

		var userId = getQueryVariable('id')
		if (userId) {
			$('#userId').val(userId)
			// 异步加载当前用户的用户名进行回显
			$.ajax({
				url: './user_get',
				type: 'get',
				data: { id: userId },
				dataType: 'json',
				success: function(res) {
					if (res.code === 0 && res.data) {
						$('#L_username').val(res.data.username)
						$('#L_email').val(res.data.email)
					} else {
						layer.msg(res.msg || "获取用户信息失败", {icon: 2})
					}
				},error: function() {
					layer.msg("请求获取用户信息接口失败", {icon: 2})
				}
			})
		}

		// 监听提交
		form.on('submit(save)', function(data) {
			var field = data.field
			if (field.newpass.length < 1 || field.newpass.length > 32) {
				layer.msg("密码长度必须在1~32个字符之间", {icon: 2})
				return false
			}

			$.ajax({
				url: './user_reset_password',
				type: 'post',
				data: {
					id: field.id,
					password: field.newpass
				},
				dataType: 'json',
				success: function(res) {
					if (res.code === 0) {
						layer.alert("修改密码成功", {icon: 6}, function() {
							var index = parent.layer.getFrameIndex(window.name)
							parent.layer.close(index)
						});
					} else {
						layer.msg(res.msg || "修改失败", {icon: 2})
					}
				},error: function() {
					layer.msg("请求接口失败", {icon: 2})
				}
			})
			return false
		})
	})
</script>
</body>
</html>
