<script type="application/javascript" language="JavaScript">
	$(document).ready(function () {
		// 监听登录表单提交事件
		$("form").on("submit", function (e) {
			e.preventDefault()  // 注释表单默认刷新跳转
			// 序列化表单数据
			const form = $(this).serialize()
			// 开启layer加载层
			const lodingIndex = layer.load(2)
			// 发送ajax异步请求
			$.ajax({
				url:"user_login",
				type:"POST",
				data:form,
				dataType:"json",
				success:function(res){
					// 关闭加载层
					layer.close(lodingIndex)
					// 将返回结果转为数字状态码
					// const code = Number(res.trim())
					if (res.code === 1){
						layer.msg(res.msg,{
							icon: 1,    // 成功图标
							time: 1500
						}, function () {
							if (res.isAdmin) {
								window.location.href = 'admin/index.jsp.htm'
							} else {
								window.location.href = 'index.htm'
							}
						})
					} else if (res.code ===  -1){
						layer.msg("账号或密码不能为空",{
							icon: 2,    // 错误失败图标
							time: 2000
						})
					} else {
						layer.msg(res.msg || "账号或密码错误",{
							icon: 2,    // 错误失败图标
							time: 2000
						})
					}
				},error:function(){
					layer.close(lodingIndex)
					layer.msg("网络异常，请稍后重试",{
						icon: 2,
						time: 2000
					})
				}
			})
		})
	})
</script>
